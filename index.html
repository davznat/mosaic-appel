<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Appel Patient - Mosaic Santé</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f0f4f8;
      color: #222;
      text-align: center;
      padding: 60px;
    }
    #message {
      font-size: 48px;
      font-weight: bold;
      margin-top: 50px;
      white-space: pre-line;
    }
  </style>
</head>
<body>
  <h1>📢 Appel des patients - Centre Mosaic Santé</h1>
  <div id="message">Chargement...</div>

  <script>
    const spreadsheetId = "1TUthCDtflujLHfihUIhK8-zlrdapwEmM";
    const sheetNames = ["Salle 1", "Salle 2", "Salle 3", "Salle 4", "Salle 5", "Salle 6", "Salle 7", "Salle 8"];
    let lastMessages = {};

    async function fetchData() {
      const messages = [];

      for (const sheetName of sheetNames) {
        const url = `https://docs.google.com/spreadsheets/d/${spreadsheetId}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(sheetName)}`;

        try {
          const response = await fetch(url);
          const text = await response.text();
          const json = JSON.parse(text.substring(47).slice(0, -2));
          const rows = json.table.rows;

          const latestRow = rows.find(r => r.c[0]);
          if (!latestRow) continue;

          const name = latestRow.c[0].v;
          const message = `${name} est attendu(e) en ${sheetName}`;

          // Afficher tous les messages
          messages.push(message);

          // Synthèse vocale si message nouveau
          if (lastMessages[sheetName] !== message) {
            lastMessages[sheetName] = message;
            const speech = new SpeechSynthesisUtterance(message);
            speech.lang = "fr-FR";
            window.speechSynthesis.speak(speech);
          }
        } catch (error) {
          console.error(`Erreur pour ${sheetName} :`, error);
        }
      }

      if (messages.length === 0) {
        document.getElementById("message").innerText = "Aucun patient à appeler.";
      } else {
        document.getElementById("message").innerText = messages.join("\n");
      }
    }

    fetchData();
    setInterval(fetchData, 10000); // rafraîchissement toutes les 10 secondes
  </script>
</body>
</html>
